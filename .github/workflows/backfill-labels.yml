name: Backfill Nutrition Labels

# Manual only, one-time (re-runnable): fetches ingredients/allergens/
# dietary_tags for every existing food_items row that's still missing
# them, instead of waiting for each item to rotate back onto a scraped
# day's menu. Safe to re-run -- it only ever touches rows that are
# still null.
on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./scraper

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run backfill
        run: python backfill_labels.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
