workflows:
  ios-capacitor-workflow:
    name: iOS Capacitor Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: appstore_creds
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.kunjalpurohit.sammyspalate
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
      cocoapods: default
    working_directory: web-app
    scripts:
      - name: Install npm dependencies
        script: npm install

      - name: Build web assets for Capacitor
        script: npm run build

      - name: Sync Capacitor iOS project
        script: npx cap sync ios

      - name: Initialize keychain and apply code signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false