services:
  web:
    image: node:22
    working_dir: /app/web-app
    volumes:
      - ./web-app:/app/web-app
    ports:
      - "3000:3000"
    environment:
      - BASE44_PREVIEW_MODE=${BASE44_PREVIEW_MODE:-0}
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - BASE44_SANDBOX_HOST_DOMAIN=${BASE44_SANDBOX_HOST_DOMAIN}
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
    env_file:
      - ./web-app/.env.base44-defaults
      - /run/base44/app.env
    command: ["sh", "-ec", "npm ci && exec npm run dev -- --hostname 0.0.0.0 --port 3000"]
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
